name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-content.mjs
      - run: npm run build
        env:
          SITE_URL: https://biohack-wiki.pages.dev
          ASTRO_TELEMETRY_DISABLED: 1
