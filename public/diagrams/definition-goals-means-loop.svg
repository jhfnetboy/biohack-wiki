<svg xmlns="http://www.w3.org/2000/svg" class="bh-fig" viewBox="0 0 892 560" width="892" height="560" role="img" aria-labelledby="definition-goals-means-loop-t definition-goals-means-loop-d"><title id="definition-goals-means-loop-t">Biohacking: goals, methods, and feedback</title><desc id="definition-goals-means-loop-d">Three goals (Restore, Enhance, Extend) say why; ten domains say what is used; measure, intervene, check the result, and adjust form a feedback loop. Original illustration for this wiki.</desc><style>
.bh-fig{--ink:#12352c;--card:#ffffff;--line:#d5e4dc;--teal:#1f7a5c;--soft:#e7f6f0;--bg:#f3f6f4;--muted:#3d5a50;--warn:#8a5a12;--warn-bg:#fff4e0;}
@media (prefers-color-scheme: dark){.bh-fig{--ink:#e7f6f0;--card:#13241f;--line:#2c4a40;--teal:#8ee0c2;--soft:#1c3d32;--bg:#121c19;--muted:#b7d4c8;--warn:#f0c27a;--warn-bg:#3a2c14;}}
.bh-fig.force-dark{--ink:#e7f6f0;--card:#13241f;--line:#2c4a40;--teal:#8ee0c2;--soft:#1c3d32;--bg:#121c19;--muted:#b7d4c8;--warn:#f0c27a;--warn-bg:#3a2c14;}
.bh-fig.force-light{--ink:#12352c;--card:#ffffff;--line:#d5e4dc;--teal:#1f7a5c;--soft:#e7f6f0;--bg:#f3f6f4;--muted:#3d5a50;--warn:#8a5a12;--warn-bg:#fff4e0;}
.bh-fig text{font-family:var(--sl-font-system, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Sarabun", "Noto Sans Thai", "Noto Sans CJK SC", "PingFang SC", sans-serif);}
.bh-fig .bg{fill:var(--bg);}
.bh-fig .kicker{font-size:10px;font-weight:700;letter-spacing:.08em;fill:var(--teal);}
.bh-fig .headline{font-size:22px;font-weight:700;letter-spacing:-.03em;fill:var(--ink);}
.bh-fig .h3{font-size:13px;font-weight:700;fill:var(--teal);letter-spacing:.02em;}
.bh-fig .card{fill:var(--card);stroke:var(--line);stroke-width:1;}
.bh-fig .card-hi{fill:var(--soft);stroke:var(--teal);stroke-width:1.5;}
.bh-fig .title{font-size:15px;font-weight:650;fill:var(--ink);}
.bh-fig .title-sm{font-size:13px;font-weight:600;fill:var(--ink);}
.bh-fig .title-xs{font-size:11px;font-weight:600;fill:var(--ink);}
.bh-fig .blurb{font-size:12px;fill:var(--muted);}
.bh-fig .note{font-size:12px;fill:var(--muted);}
.bh-fig .idx{font-size:11px;font-weight:700;fill:var(--teal);letter-spacing:.06em;}
.bh-fig .accent{fill:var(--teal);}
.bh-fig .stroke{stroke:var(--teal);fill:none;stroke-width:1.6;}
.bh-fig .stroke-muted{stroke:var(--line);fill:none;stroke-width:1.4;}
.bh-fig .warn{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1;}
.bh-fig .warn-t{font-size:12px;fill:var(--warn);font-weight:600;}
.bh-fig .pill{fill:var(--teal);}
.bh-fig .pill-t{font-size:11px;font-weight:700;fill:var(--card);}
.bh-fig .grad-a{stop-color:var(--soft);} .bh-fig .grad-b{stop-color:var(--teal);}
</style><defs><marker id="definition-goals-means-loop-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker></defs><rect x="0" y="0" width="892" height="560" rx="16" class="bg"/><text x="28" y="36" class="kicker" text-anchor="start">This wiki’s definition</text><text x="28" y="64" class="headline" text-anchor="start">Biohacking = goals × methods × feedback</text><text x="28" y="86" class="note" text-anchor="start">Self-directed, deliberately intervening in one’s own body and mind to restore, enhance,</text><text x="28" y="102" class="note" text-anchor="start">or extend — and checking the result.</text><text x="28" y="128" class="h3" text-anchor="start">Why · three goals</text><rect x="28" y="142" width="220" height="98" rx="12" class="card"/><rect x="28" y="142" width="5" height="98" rx="2" class="accent"/><text x="48" y="172" class="title" text-anchor="start">Restore</text><text x="48" y="198" class="blurb" text-anchor="start">Bring a lost or damaged</text><text x="48" y="214" class="blurb" text-anchor="start">function toward a usual level</text><rect x="28" y="254" width="220" height="98" rx="12" class="card"/><rect x="28" y="254" width="5" height="98" rx="2" class="accent"/><text x="48" y="284" class="title" text-anchor="start">Enhance</text><text x="48" y="310" class="blurb" text-anchor="start">Take a usual function past</text><text x="48" y="326" class="blurb" text-anchor="start">typical, or add a new one</text><rect x="28" y="366" width="220" height="98" rx="12" class="card"/><rect x="28" y="366" width="5" height="98" rx="2" class="accent"/><text x="48" y="396" class="title" text-anchor="start">Extend</text><text x="48" y="422" class="blurb" text-anchor="start">Postpone age-related decline</text><text x="48" y="438" class="blurb" text-anchor="start">and lengthen healthspan</text><text x="280" y="128" class="h3" text-anchor="start">What is used · ten domains</text><rect x="280" y="142" width="124" height="52" rx="10" class="card"/><text x="294" y="158" class="idx" text-anchor="start">01</text><text x="294" y="180" class="title-xs" text-anchor="start">Quantified self</text><rect x="412" y="142" width="124" height="52" rx="10" class="card"/><text x="426" y="158" class="idx" text-anchor="start">02</text><text x="426" y="174" class="title-xs" text-anchor="start">Environmental</text><text x="426" y="188" class="title-xs" text-anchor="start">signals</text><rect x="280" y="206" width="124" height="52" rx="10" class="card"/><text x="294" y="222" class="idx" text-anchor="start">03</text><text x="294" y="244" class="title-sm" text-anchor="start">Biochemical</text><rect x="412" y="206" width="124" height="52" rx="10" class="card"/><text x="426" y="222" class="idx" text-anchor="start">04</text><text x="426" y="244" class="title-sm" text-anchor="start">Peptides</text><rect x="280" y="270" width="124" height="52" rx="10" class="card"/><text x="294" y="286" class="idx" text-anchor="start">05</text><text x="294" y="308" class="title-sm" text-anchor="start">Genetic</text><rect x="412" y="270" width="124" height="52" rx="10" class="card"/><text x="426" y="286" class="idx" text-anchor="start">06</text><text x="426" y="302" class="title-xs" text-anchor="start">Cellular &amp;</text><text x="426" y="316" class="title-xs" text-anchor="start">regenerative</text><rect x="280" y="334" width="124" height="52" rx="10" class="card"/><text x="294" y="350" class="idx" text-anchor="start">07</text><text x="294" y="372" class="title-sm" text-anchor="start">Microbiome</text><rect x="412" y="334" width="124" height="52" rx="10" class="card"/><text x="426" y="350" class="idx" text-anchor="start">08</text><text x="426" y="372" class="title-sm" text-anchor="start">Neurotech</text><rect x="280" y="398" width="124" height="52" rx="10" class="card"/><text x="294" y="414" class="idx" text-anchor="start">09</text><text x="294" y="430" class="title-xs" text-anchor="start">Cyborg</text><text x="294" y="444" class="title-xs" text-anchor="start">implants</text><rect x="412" y="398" width="124" height="52" rx="10" class="card"/><text x="426" y="414" class="idx" text-anchor="start">10</text><text x="426" y="436" class="title-sm" text-anchor="start">Bionics</text><path d="M252 310 H272" class="stroke" marker-end="url(#definition-goals-means-loop-arr)"/><path d="M542 310 H566" class="stroke" marker-end="url(#definition-goals-means-loop-arr)"/><text x="580" y="128" class="h3" text-anchor="start">How · a feedback loop</text><circle cx="728" cy="310" r="96" class="stroke-muted"/><path d="M754.5 217.7 A96 96 0 0 1 820.3 283.5" class="stroke" marker-end="url(#definition-goals-means-loop-arr)"/><path d="M820.3 336.5 A96 96 0 0 1 754.5 402.3" class="stroke" marker-end="url(#definition-goals-means-loop-arr)"/><path d="M701.5 402.3 A96 96 0 0 1 635.7 336.5" class="stroke" marker-end="url(#definition-goals-means-loop-arr)"/><path d="M635.7 283.5 A96 96 0 0 1 701.5 217.7" class="stroke" marker-end="url(#definition-goals-means-loop-arr)"/><rect x="652.0" y="188" width="152" height="52" rx="10" class="card"/><text x="728" y="210" class="title-xs" text-anchor="middle">1. Measure first</text><text x="728" y="228" class="blurb" text-anchor="middle">See where you are now</text><rect x="748.0" y="284" width="152" height="52" rx="10" class="card"/><text x="824" y="306" class="title-xs" text-anchor="middle">2. Intervene</text><text x="824" y="324" class="blurb" text-anchor="middle">Choose the methods</text><rect x="652.0" y="380" width="152" height="52" rx="10" class="card"/><text x="728" y="402" class="title-xs" text-anchor="middle">3. Check the result</text><text x="728" y="420" class="blurb" text-anchor="middle">Data or a change you notice</text><rect x="556.0" y="284" width="152" height="52" rx="10" class="card"/><text x="632" y="306" class="title-xs" text-anchor="middle">4. Adjust or stop</text><text x="632" y="324" class="blurb" text-anchor="middle">Decide from the result</text><rect x="28" y="508" width="836" height="38" rx="10" class="warn"/><text x="46" y="522" class="warn-t" text-anchor="start">The same method can serve more than one goal. Being on this diagram is</text><text x="46" y="538" class="warn-t" text-anchor="start">not a claim that something is proven, safe, or legal.</text></svg>