<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
  <title id="title">十个领域（编辑地图）</title>
  <desc id="desc">本维基十个领域的原始示意图，不是从第三方复制。每个方块链到该领域的首页。</desc>
  <rect width="920" height="620" fill="#f4f7f5"/>
  <text x="32" y="42" font-family="Georgia, serif" font-size="22" fill="#12352c">十个领域（编辑地图）</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#12352c">
    <a href="/zh-cn/quantified-self/">
      <g>
        <rect x="32" y="78" width="270" height="64" rx="8" fill="#fff4cc"/>
        <text x="48" y="104">1 量化自我</text>
        <text x="48" y="124" font-size="12" fill="#245">可穿戴、连续血糖、心率变异</text>
      </g>
    </a>
    <a href="/zh-cn/lifestyle/">
      <g>
        <rect x="322" y="78" width="270" height="64" rx="8" fill="#efe7ff"/>
        <text x="338" y="104">2 环境信号</text>
        <text x="338" y="124" font-size="12" fill="#245">光照、冷热、时间</text>
      </g>
    </a>
    <a href="/zh-cn/biochemical/">
      <g>
        <rect x="32" y="168" width="270" height="64" rx="8" fill="#d7f5ea"/>
        <text x="48" y="194">3 生化小分子</text>
        <text x="48" y="214" font-size="12" fill="#245">小分子、激素、促认知</text>
      </g>
    </a>
    <a href="/zh-cn/peptides/">
      <g>
        <rect x="322" y="168" width="270" height="64" rx="8" fill="#c5ebd8"/>
        <text x="338" y="194">4 肽</text>
        <text x="338" y="214" font-size="12" fill="#245">氨基酸信号、纯度</text>
      </g>
    </a>
    <a href="/zh-cn/genetic/">
      <g>
        <rect x="32" y="258" width="270" height="64" rx="8" fill="#f7dce3"/>
        <text x="48" y="284">5 基因</text>
        <text x="48" y="304" font-size="12" fill="#245">基因、RNA、合成生物学</text>
      </g>
    </a>
    <a href="/zh-cn/cellular/">
      <g>
        <rect x="322" y="258" width="270" height="64" rx="8" fill="#f3d4e8"/>
        <text x="338" y="284">6 细胞与再生</text>
        <text x="338" y="304" font-size="12" fill="#245">干细胞、组织、重编程</text>
      </g>
    </a>
    <a href="/zh-cn/microbiome/">
      <g>
        <rect x="612" y="258" width="270" height="64" rx="8" fill="#e3f6f2"/>
        <text x="628" y="284">7 微生物组</text>
        <text x="628" y="304" font-size="12" fill="#245">肠道、饮食、微生物</text>
      </g>
    </a>
    <a href="/zh-cn/neurohacking/">
      <g>
        <rect x="32" y="348" width="270" height="64" rx="8" fill="#d7e8f5"/>
        <text x="48" y="374">8 神经科技</text>
        <text x="48" y="394" font-size="12" fill="#245">记录、刺激、脑机接口</text>
      </g>
    </a>
    <a href="/zh-cn/cyborg/">
      <g>
        <rect x="322" y="348" width="270" height="64" rx="8" fill="#f7e7d8"/>
        <text x="338" y="374">9 植入与赛博格</text>
        <text x="338" y="394" font-size="12" fill="#245">植入、磁铁、传感器</text>
      </g>
    </a>
    <a href="/zh-cn/bionic/">
      <g>
        <rect x="612" y="348" width="270" height="64" rx="8" fill="#e7e4f7"/>
        <text x="628" y="374">10 仿生</text>
        <text x="628" y="394" font-size="12" fill="#245">假肢、外骨骼</text>
      </g>
    </a>
  </g>
  <text x="32" y="478" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#333">方块可以重叠。同一个项目可以归入不止一个领域。</text>
  <text x="32" y="506" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#333">归在 8 和 10 的例子：用神经系统的信号驱动辅助装置。</text>
  <path d="M302 380 H310 V422 H612 V380" stroke="#12352c" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#12352c"/>
    </marker>
  </defs>
</svg>
