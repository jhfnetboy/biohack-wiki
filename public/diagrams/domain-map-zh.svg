      <a class="node" href="/zh-cn/genetic/" aria-label="05 基因">
        <g transform="translate(24 240)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">05</text>
          <text class="title" x="44" y="22">基因</text>
          <text class="blurb" x="16" y="46">基因、RNA、合成生物学</text>
        </g>
      </a>
      <a class="node" href="/zh-cn/cellular/" aria-label="06 细胞与再生">
        <g transform="translate(312 240)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">06</text>
          <text class="title" x="44" y="22">细胞与再生</text>
          <text class="blurb" x="16" y="46">干细胞、组织、重编程</text>
        </g>
      </a>
      <a class="node" href="/zh-cn/microbiome/" aria-label="07 微生物组">
        <g transform="translate(600 240)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">07</text>
          <text class="title" x="44" y="22">微生物组</text>
          <text class="blurb" x="16" y="46">肠道、饮食、微生物</text>
        </g>
      </a>
      <a class="node" href="/zh-cn/neurohacking/" aria-label="08 神经科技">
        <g transform="translate(24 324)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">08</text>
          <text class="title" x="44" y="22">神经科技</text>
          <text class="blurb" x="16" y="46">记录、刺激、脑机接口</text>
        </g>
      </a>
      <a class="node" href="/zh-cn/cyborg/" aria-label="09 植入与赛博格">
        <g transform="translate(312 324)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">09</text>
          <text class="title" x="44" y="22">植入与赛博格</text>
          <text class="blurb" x="16" y="46">植入、磁铁、传感器</text>
        </g>
      </a>
      <a class="node" href="/zh-cn/bionic/" aria-label="10 仿生">
        <g transform="translate(600 324)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">10</text>
          <text class="title" x="44" y="22">仿生</text>
          <text class="blurb" x="16" y="46">假肢、外骨骼</text>
        </g>
      </a>
    <text class="note" x="24" y="430">卡片可以重叠。同一个项目可以归入不止一个领域。</text>
    <text class="note" x="24" y="450">归在 08 和 10 的例子：用神经系统的信号驱动辅助装置。</text>
  </svg>
