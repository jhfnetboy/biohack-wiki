<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Nine biohacking domains</title>
  <desc id="desc">Original diagram of the wiki's nine filing domains. Not copied from a third party.</desc>
  <rect width="920" height="520" fill="#f4f7f5"/>
  <text x="32" y="42" font-family="Georgia, serif" font-size="22" fill="#12352c">Nine domains (editorial map)</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#12352c">
    <g>
      <rect x="32" y="70" width="270" height="64" rx="8" fill="#d7f5ea"/>
      <text x="48" y="96">1 Biochemical</text>
      <text x="48" y="116" font-size="12" fill="#245">peptides, hormones, nootropics</text>
    </g>
    <g>
      <rect x="322" y="70" width="270" height="64" rx="8" fill="#d7e8f5"/>
      <text x="338" y="96">2 Neurohacking</text>
      <text x="338" y="116" font-size="12" fill="#245">recording, stimulation, BCI</text>
    </g>
    <g>
      <rect x="612" y="70" width="270" height="64" rx="8" fill="#e7e4f7"/>
      <text x="628" y="96">3 Bionic augmentation</text>
      <text x="628" y="116" font-size="12" fill="#245">prostheses, exoskeletons</text>
    </g>
    <g>
      <rect x="32" y="160" width="270" height="64" rx="8" fill="#f7e7d8"/>
      <text x="48" y="186">4 Cyborg / grinder</text>
      <text x="48" y="206" font-size="12" fill="#245">implants, magnets, sensors</text>
    </g>
    <g>
      <rect x="322" y="160" width="270" height="64" rx="8" fill="#f7dce3"/>
      <text x="338" y="186">5 Genetic</text>
      <text x="338" y="206" font-size="12" fill="#245">gene, cell, synthetic biology</text>
    </g>
    <g>
      <rect x="612" y="160" width="270" height="64" rx="8" fill="#e5f3d8"/>
      <text x="628" y="186">6 Longevity</text>
      <text x="628" y="206" font-size="12" fill="#245">hallmarks, clocks, healthspan</text>
    </g>
    <g>
      <rect x="32" y="250" width="270" height="64" rx="8" fill="#fff4cc"/>
      <text x="48" y="276">7 Quantified self</text>
      <text x="48" y="296" font-size="12" fill="#245">wearables, CGM, HRV</text>
    </g>
    <g>
      <rect x="322" y="250" width="270" height="64" rx="8" fill="#e3f6f2"/>
      <text x="338" y="276">8 Microbiome</text>
      <text x="338" y="296" font-size="12" fill="#245">gut, diet, microbes</text>
    </g>
    <g>
      <rect x="612" y="250" width="270" height="64" rx="8" fill="#efe7ff"/>
      <text x="628" y="276">9 Lifestyle / environment</text>
      <text x="628" y="296" font-size="12" fill="#245">light, sleep, temperature, movement</text>
    </g>
  </g>
  <text x="32" y="360" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#333">The boxes overlap on purpose. A single project can sit in more than one domain.</text>
  <text x="32" y="388" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#333">Example filed under 2 and 3: signals from the nervous system used to move an assistive device.</text>
  <path d="M450 134 H612" stroke="#12352c" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#12352c"/>
    </marker>
  </defs>
</svg>
