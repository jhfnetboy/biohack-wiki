<svg xmlns="http://www.w3.org/2000/svg" class="bh-domain-map" width="100%" role="group" aria-labelledby="bh-domain-map-title bh-domain-map-desc">
  <title id="bh-domain-map-title">Ten biohacking domains</title>
  <desc id="bh-domain-map-desc">Diagram of the wiki's ten domains. Not copied from a third party. Each card links to that domain's landing page.</desc>
  <style>
    .bh-domain-map {
      --dm-ink: #12352c;
      --dm-card: #ffffff;
      --dm-line: #d5e4dc;
      --dm-teal: #1f7a5c;
      --dm-banner: #f3f6f4;
      --dm-muted: #3d5a50;
      background: transparent;
    }
    @media (prefers-color-scheme: dark) {
      .bh-domain-map {
        --dm-ink: #e7f6f0;
        --dm-card: #13241f;
        --dm-line: #2c4a40;
        --dm-teal: #8ee0c2;
        --dm-banner: #121c19;
        --dm-muted: #b7d4c8;
      }
    }
    .bh-domain-map .bg { fill: var(--dm-banner); }
    .bh-domain-map .headline {
      font-family: var(--sl-font-system, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      fill: var(--dm-ink);
    }
    .bh-domain-map .kicker {
      font-family: var(--sl-font-system, ui-sans-serif, system-ui, sans-serif);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      fill: var(--dm-teal);
    }
    .bh-domain-map .note {
      font-family: var(--sl-font-system, ui-sans-serif, system-ui, sans-serif);
      font-size: 13px;
      fill: var(--dm-muted);
    }
    .bh-domain-map .card {
      fill: var(--dm-card);
      stroke: var(--dm-line);
      stroke-width: 1;
    }
    .bh-domain-map .accent { fill: var(--dm-teal); }
    .bh-domain-map .idx {
      font-family: var(--sl-font-system, ui-sans-serif, system-ui, sans-serif);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      fill: var(--dm-teal);
    }
    .bh-domain-map .title {
      font-family: var(--sl-font-system, ui-sans-serif, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 650;
      fill: var(--dm-ink);
    }
    .bh-domain-map .blurb {
      font-family: var(--sl-font-system, ui-sans-serif, system-ui, sans-serif);
      font-size: 12px;
      fill: var(--dm-muted);
    }
    .bh-domain-map .dm-mobile .headline { font-size: 24px; }
    .bh-domain-map .dm-mobile .title { font-size: 16px; }
    .bh-domain-map .dm-mobile .blurb { font-size: 13px; }
    .bh-domain-map .dm-mobile .idx { font-size: 12px; }
    .bh-domain-map a.node { cursor: pointer; }
    .bh-domain-map a.node:hover .card,
    .bh-domain-map a.node:focus-visible .card { stroke: var(--dm-teal); }
    /* Aspect-ratio and show/hide apply only to the standalone wrapper
       (a root .bh-domain-map that is not itself a hoisted layout). */
    svg.bh-domain-map:not(.dm-desktop):not(.dm-mobile) {
      width: 100%;
      height: auto;
      display: block;
    }
    svg.bh-domain-map:not(.dm-desktop):not(.dm-mobile) .dm-desktop,
    svg.bh-domain-map:not(.dm-desktop):not(.dm-mobile) .dm-mobile {
      width: 100%;
      height: 100%;
    }
    @media (min-width: 641px) {
      svg.bh-domain-map:not(.dm-desktop):not(.dm-mobile) .dm-mobile { display: none; }
      svg.bh-domain-map:not(.dm-desktop):not(.dm-mobile) { aspect-ratio: 892 / 500; }
    }
    @media (max-width: 640px) {
      svg.bh-domain-map:not(.dm-desktop):not(.dm-mobile) .dm-desktop { display: none; }
      svg.bh-domain-map:not(.dm-desktop):not(.dm-mobile) { aspect-ratio: 400 / 1040; }
    }
  </style>
  <svg class="dm-desktop" viewBox="0 0 892 500" width="100%" height="100%" overflow="visible">
    <rect class="bg" width="892" height="500" rx="16"/>
    <text class="kicker" x="24" y="32">Editorial map</text>
    <text class="headline" x="24" y="54">Ten domains</text>
      <a class="node" href="/quantified-self/" aria-label="01 Quantified self">
        <g transform="translate(24 72)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">01</text>
          <text class="title" x="44" y="22">Quantified self</text>
          <text class="blurb" x="16" y="46">wearables, CGM, HRV</text>
        </g>
      </a>
      <a class="node" href="/lifestyle/" aria-label="02 Environmental Signals">
        <g transform="translate(312 72)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">02</text>
          <text class="title" x="44" y="22">Environmental Signals</text>
          <text class="blurb" x="16" y="46">light, cold, heat, timing</text>
        </g>
      </a>
      <a class="node" href="/biochemical/" aria-label="03 Biochemical">
        <g transform="translate(24 156)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">03</text>
          <text class="title" x="44" y="22">Biochemical</text>
          <text class="blurb" x="16" y="46">small molecules, hormones, nootropics</text>
        </g>
      </a>
      <a class="node" href="/peptides/" aria-label="04 Peptides">
        <g transform="translate(312 156)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">04</text>
          <text class="title" x="44" y="22">Peptides</text>
          <text class="blurb" x="16" y="46">amino-acid signals, purity</text>
        </g>
      </a>
      <a class="node" href="/genetic/" aria-label="05 Genetic">
        <g transform="translate(24 240)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">05</text>
          <text class="title" x="44" y="22">Genetic</text>
          <text class="blurb" x="16" y="46">gene, RNA, synthetic biology</text>
        </g>
      </a>
      <a class="node" href="/cellular/" aria-label="06 Cellular &amp; Regenerative">
        <g transform="translate(312 240)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">06</text>
          <text class="title" x="44" y="22">Cellular &amp; Regenerative</text>
          <text class="blurb" x="16" y="46">stem cells, tissue, reprogramming</text>
        </g>
      </a>
      <a class="node" href="/microbiome/" aria-label="07 Microbiome">
        <g transform="translate(600 240)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">07</text>
          <text class="title" x="44" y="22">Microbiome</text>
          <text class="blurb" x="16" y="46">gut, diet, microbes</text>
        </g>
      </a>
      <a class="node" href="/neurohacking/" aria-label="08 Neurotech">
        <g transform="translate(24 324)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">08</text>
          <text class="title" x="44" y="22">Neurotech</text>
          <text class="blurb" x="16" y="46">recording, stimulation, BCI</text>
        </g>
      </a>
      <a class="node" href="/cyborg/" aria-label="09 Cyborg implants">
        <g transform="translate(312 324)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">09</text>
          <text class="title" x="44" y="22">Cyborg implants</text>
          <text class="blurb" x="16" y="46">implants, magnets, sensors</text>
        </g>
      </a>
      <a class="node" href="/bionic/" aria-label="10 Bionics">
        <g transform="translate(600 324)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">10</text>
          <text class="title" x="44" y="22">Bionics</text>
          <text class="blurb" x="16" y="46">prostheses, exoskeletons</text>
        </g>
      </a>
    <text class="note" x="24" y="430">Cards can overlap: one project may belong to more than one domain.</text>
    <text class="note" x="24" y="450">Example under 08 and 10: nerve signals used to move an assistive device.</text>
  </svg>
