<svg xmlns="http://www.w3.org/2000/svg" class="bh-fig" viewBox="0 0 892 420" width="892" height="420" role="img" aria-labelledby="definition-spectrum-th-t definition-spectrum-th-d"><title id="definition-spectrum-th-t">สเปกตรัมของไบโอแฮกกิง จากเรื่องประจำวันถึงแนวหน้า</title><desc id="definition-spectrum-th-d">จากการปรับที่วัดได้ในชีวิตประจำวัน ไปถึงเครื่องมือและอาหารเสริมระดับผู้บริโภค วิธีระดับคลินิก และงานที่ยังทดลองหรืออยู่นอกสถาบัน ตำแหน่งบนสเปกตรัมไม่ใช่ระดับความเสี่ยงหรือหลักฐาน ภาพประกอบต้นฉบับของวิกินี้</desc><style>
.bh-fig{--ink:#12352c;--card:#ffffff;--line:#d5e4dc;--teal:#1f7a5c;--soft:#e7f6f0;--bg:#f3f6f4;--muted:#3d5a50;--warn:#8a5a12;--warn-bg:#fff4e0;}
@media (prefers-color-scheme: dark){.bh-fig{--ink:#e7f6f0;--card:#13241f;--line:#2c4a40;--teal:#8ee0c2;--soft:#1c3d32;--bg:#121c19;--muted:#b7d4c8;--warn:#f0c27a;--warn-bg:#3a2c14;}}
.bh-fig.force-dark{--ink:#e7f6f0;--card:#13241f;--line:#2c4a40;--teal:#8ee0c2;--soft:#1c3d32;--bg:#121c19;--muted:#b7d4c8;--warn:#f0c27a;--warn-bg:#3a2c14;}
.bh-fig.force-light{--ink:#12352c;--card:#ffffff;--line:#d5e4dc;--teal:#1f7a5c;--soft:#e7f6f0;--bg:#f3f6f4;--muted:#3d5a50;--warn:#8a5a12;--warn-bg:#fff4e0;}
.bh-fig text{font-family:var(--sl-font-system, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Sarabun", "Noto Sans Thai", "Noto Sans CJK SC", "PingFang SC", sans-serif);}
.bh-fig .bg{fill:var(--bg);}
.bh-fig .kicker{font-size:10px;font-weight:700;letter-spacing:.08em;fill:var(--teal);}
.bh-fig .headline{font-size:22px;font-weight:700;letter-spacing:-.03em;fill:var(--ink);}
.bh-fig .h3{font-size:13px;font-weight:700;fill:var(--teal);letter-spacing:.02em;}
.bh-fig .card{fill:var(--card);stroke:var(--line);stroke-width:1;}
.bh-fig .card-hi{fill:var(--soft);stroke:var(--teal);stroke-width:1.5;}
.bh-fig .title{font-size:15px;font-weight:650;fill:var(--ink);}
.bh-fig .title-sm{font-size:13px;font-weight:600;fill:var(--ink);}
.bh-fig .title-xs{font-size:11px;font-weight:600;fill:var(--ink);}
.bh-fig .blurb{font-size:12px;fill:var(--muted);}
.bh-fig .note{font-size:12px;fill:var(--muted);}
.bh-fig .idx{font-size:11px;font-weight:700;fill:var(--teal);letter-spacing:.06em;}
.bh-fig .accent{fill:var(--teal);}
.bh-fig .stroke{stroke:var(--teal);fill:none;stroke-width:1.6;}
.bh-fig .stroke-muted{stroke:var(--line);fill:none;stroke-width:1.4;}
.bh-fig .warn{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1;}
.bh-fig .warn-t{font-size:12px;fill:var(--warn);font-weight:600;}
.bh-fig .pill{fill:var(--teal);}
.bh-fig .pill-t{font-size:11px;font-weight:700;fill:var(--card);}
.bh-fig .grad-a{stop-color:var(--soft);} .bh-fig .grad-b{stop-color:var(--teal);}
</style><defs><marker id="definition-spectrum-th-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker></defs><rect x="0" y="0" width="892" height="420" rx="16" class="bg"/><text x="28" y="36" class="kicker" text-anchor="start">จากเรื่องประจำวันถึงแนวหน้า</text><text x="28" y="64" class="headline" text-anchor="start">ไบโอแฮกกิงเป็นสเปกตรัม ไม่ใช่เพียงการทดลองใต้ดิน</text><defs><linearGradient id="definition-spectrum-th-g2" x1="0" x2="1"><stop offset="0" class="grad-a"/><stop offset="1" class="grad-b"/></linearGradient></defs><rect x="28" y="96" width="836" height="14" rx="7" fill="url(#definition-spectrum-th-g2)"/><text x="28" y="130" class="title-sm" text-anchor="start">ประจำวัน</text><text x="864" y="130" class="title-sm" text-anchor="end">แนวหน้า</text><circle cx="128.0" cy="103" r="7" class="accent"/><rect x="28" y="146" width="200" height="164" rx="12" class="card"/><text x="44" y="168" class="title-sm" text-anchor="start">การปรับที่วัดได้</text><circle cx="48" cy="192" r="2.5" class="accent"/><text x="58" y="196" class="blurb" text-anchor="start">บันทึกการนอนและชีพจร</text><circle cx="48" cy="214" r="2.5" class="accent"/><text x="58" y="218" class="blurb" text-anchor="start">แสงเช้าและความเย็นตามแผน</text><circle cx="48" cy="236" r="2.5" class="accent"/><text x="58" y="240" class="blurb" text-anchor="start">การกินตามช่วงเวลา</text><line x1="44" y1="274" x2="212" y2="274" class="stroke-muted"/><text x="44" y="292" class="idx" text-anchor="start">สัญญาณสิ่งแวดล้อม ·</text><text x="44" y="306" class="idx" text-anchor="start">การวัดตนเอง</text><circle cx="340.0" cy="103" r="7" class="accent"/><rect x="240" y="146" width="200" height="164" rx="12" class="card"/><text x="256" y="168" class="title-sm" text-anchor="start">เครื่องมือผู้บริโภค</text><circle cx="260" cy="192" r="2.5" class="accent"/><text x="270" y="196" class="blurb" text-anchor="start">อุปกรณ์สวมใส่</text><circle cx="260" cy="214" r="2.5" class="accent"/><text x="270" y="218" class="blurb" text-anchor="start">เครื่องวัดน้ำตาลต่อเนื่อง</text><circle cx="260" cy="236" r="2.5" class="accent"/><text x="270" y="240" class="blurb" text-anchor="start">อาหารเสริม</text><line x1="256" y1="274" x2="424" y2="274" class="stroke-muted"/><text x="256" y="292" class="idx" text-anchor="start">การวัดตนเอง ·</text><text x="256" y="306" class="idx" text-anchor="start">ชีวเคมีโมเลกุลเล็ก</text><circle cx="552.0" cy="103" r="7" class="accent"/><rect x="452" y="146" width="200" height="164" rx="12" class="card"/><text x="468" y="168" class="title-sm" text-anchor="start">ระดับคลินิก</text><circle cx="472" cy="192" r="2.5" class="accent"/><text x="482" y="196" class="blurb" text-anchor="start">ยาและเปปไทด์ที่อนุมัติแล้ว</text><circle cx="472" cy="214" r="2.5" class="accent"/><text x="482" y="218" class="blurb" text-anchor="start">อวัยวะเทียม</text><circle cx="472" cy="236" r="2.5" class="accent"/><text x="482" y="240" class="blurb" text-anchor="start">การกระตุ้นประสาทที่อนุมัติแล้ว</text><line x1="468" y1="274" x2="636" y2="274" class="stroke-muted"/><text x="468" y="292" class="idx" text-anchor="start">เปปไทด์ · ไบโอนิก ·</text><text x="468" y="306" class="idx" text-anchor="start">เทคโนโลยีประสาท</text><circle cx="764.0" cy="103" r="7" class="accent"/><rect x="664" y="146" width="200" height="164" rx="12" class="card"/><text x="680" y="168" class="title-sm" text-anchor="start">ทดลอง / นอกสถาบัน</text><circle cx="684" cy="192" r="2.5" class="accent"/><text x="694" y="196" class="blurb" text-anchor="start">ยีนบำบัดและการตัดต่อ</text><circle cx="684" cy="214" r="2.5" class="accent"/><text x="694" y="218" class="blurb" text-anchor="start">ส่วนต่อประสานสมองกับคอมพิวเตอร์</text><circle cx="684" cy="236" r="2.5" class="accent"/><text x="694" y="240" class="blurb" text-anchor="start">ชิปและแม่เหล็กที่ฝังเอง</text><line x1="680" y1="274" x2="848" y2="274" class="stroke-muted"/><text x="680" y="292" class="idx" text-anchor="start">พันธุกรรม · ประสาท · ไซบอร์ก</text><rect x="28" y="330" width="410" height="62" rx="10" class="warn"/><text x="44" y="352" class="warn-t" text-anchor="start">ใกล้ชีวิตประจำวันกว่า ไม่ได้แปลว่าความเสี่ยงต่ำกว่า</text><text x="44" y="370" class="warn-t" text-anchor="start">ใกล้แนวหน้ากว่า ไม่ได้แปลว่ามีหลักฐานดีกว่า</text><rect x="454" y="330" width="410" height="62" rx="10" class="card"/><text x="470" y="352" class="note" text-anchor="start">ความถูกกฎหมายขึ้นกับสถานที่ ใบอนุญาต และการใช้</text><text x="470" y="370" class="note" text-anchor="start">ตัวอย่างเป็นการอธิบาย ไม่ใช่คำแนะนำ</text></svg>