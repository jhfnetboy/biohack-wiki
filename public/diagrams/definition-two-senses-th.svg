<svg xmlns="http://www.w3.org/2000/svg" class="bh-fig" viewBox="0 0 892 640" width="892" height="640" role="img" aria-labelledby="definition-two-senses-th-t definition-two-senses-th-d"><title id="definition-two-senses-th-t">สองความหมายของไบโอแฮกกิง และเส้นเวลาของแหล่งข้อมูล</title><desc id="definition-two-senses-th-d">พจนานุกรมแบ่งไบโอแฮกกิงเป็นสองความหมาย: ชีววิทยาแบบทำเอง และการปรับร่างกายและจิตใจของตนเอง วิกินี้ครอบคลุมความหมายหลัง เส้นเวลาด้านล่างคือแหล่งที่ตรวจสอบแล้วในหน้านี้ ภาพประกอบต้นฉบับของวิกินี้</desc><style>
.bh-fig{--ink:#12352c;--card:#ffffff;--line:#d5e4dc;--teal:#1f7a5c;--soft:#e7f6f0;--bg:#f3f6f4;--muted:#3d5a50;--warn:#8a5a12;--warn-bg:#fff4e0;}
@media (prefers-color-scheme: dark){.bh-fig{--ink:#e7f6f0;--card:#13241f;--line:#2c4a40;--teal:#8ee0c2;--soft:#1c3d32;--bg:#121c19;--muted:#b7d4c8;--warn:#f0c27a;--warn-bg:#3a2c14;}}
.bh-fig.force-dark{--ink:#e7f6f0;--card:#13241f;--line:#2c4a40;--teal:#8ee0c2;--soft:#1c3d32;--bg:#121c19;--muted:#b7d4c8;--warn:#f0c27a;--warn-bg:#3a2c14;}
.bh-fig.force-light{--ink:#12352c;--card:#ffffff;--line:#d5e4dc;--teal:#1f7a5c;--soft:#e7f6f0;--bg:#f3f6f4;--muted:#3d5a50;--warn:#8a5a12;--warn-bg:#fff4e0;}
.bh-fig text{font-family:var(--sl-font-system, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Sarabun", "Noto Sans Thai", "Noto Sans CJK SC", "PingFang SC", sans-serif);}
.bh-fig .bg{fill:var(--bg);}
.bh-fig .kicker{font-size:10px;font-weight:700;letter-spacing:.08em;fill:var(--teal);}
.bh-fig .headline{font-size:22px;font-weight:700;letter-spacing:-.03em;fill:var(--ink);}
.bh-fig .h3{font-size:13px;font-weight:700;fill:var(--teal);letter-spacing:.02em;}
.bh-fig .card{fill:var(--card);stroke:var(--line);stroke-width:1;}
.bh-fig .card-hi{fill:var(--soft);stroke:var(--teal);stroke-width:1.5;}
.bh-fig .title{font-size:15px;font-weight:650;fill:var(--ink);}
.bh-fig .title-sm{font-size:13px;font-weight:600;fill:var(--ink);}
.bh-fig .title-xs{font-size:11px;font-weight:600;fill:var(--ink);}
.bh-fig .blurb{font-size:12px;fill:var(--muted);}
.bh-fig .note{font-size:12px;fill:var(--muted);}
.bh-fig .idx{font-size:11px;font-weight:700;fill:var(--teal);letter-spacing:.06em;}
.bh-fig .accent{fill:var(--teal);}
.bh-fig .stroke{stroke:var(--teal);fill:none;stroke-width:1.6;}
.bh-fig .stroke-muted{stroke:var(--line);fill:none;stroke-width:1.4;}
.bh-fig .warn{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1;}
.bh-fig .warn-t{font-size:12px;fill:var(--warn);font-weight:600;}
.bh-fig .pill{fill:var(--teal);}
.bh-fig .pill-t{font-size:11px;font-weight:700;fill:var(--card);}
.bh-fig .grad-a{stop-color:var(--soft);} .bh-fig .grad-b{stop-color:var(--teal);}
</style><defs><marker id="definition-two-senses-th-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker></defs><rect x="0" y="0" width="892" height="640" rx="16" class="bg"/><text x="28" y="36" class="kicker" text-anchor="start">คำนี้มาจากไหน</text><text x="28" y="64" class="headline" text-anchor="start">คำเดียว สองความหมาย: วิกินี้เก็บความหมายใด</text><rect x="28" y="92" width="400" height="198" rx="16" class="card"/><text x="48" y="122" class="title" text-anchor="start">ความหมาย 1 · ชีววิทยาแบบทำเอง</text><text x="48" y="142" class="idx" text-anchor="start">เคมบริดจ์: การทดลองโดยไม่เป็นทางการ</text><text x="48" y="170" class="blurb" text-anchor="start">ผู้ที่อยู่นอกห้องปฏิบัติการทางการ</text><text x="48" y="188" class="blurb" text-anchor="start">ทดลองทางชีววิทยา มักกับแบคทีเรีย ยีสต์</text><text x="48" y="206" class="blurb" text-anchor="start">พืช หรือยีน ที่บ้านหรือแล็บชุมชน</text><rect x="48" y="240" width="200" height="34" rx="8" class="card"/><text x="148" y="262" class="title-sm" text-anchor="middle">วิกินี้: เพียงพื้นหลัง</text><rect x="464" y="92" width="400" height="198" rx="16" class="card-hi"/><text x="484" y="122" class="title" text-anchor="start">ความหมาย 2 · ร่างกายและจิตใจตนเอง</text><text x="484" y="142" class="idx" text-anchor="start">เคมบริดจ์: ปรับปรุงร่างกายและจิตใจ</text><text x="484" y="170" class="blurb" text-anchor="start">ใช้เทคโนโลยี ยา อาหาร ฮอร์โมน</text><text x="484" y="188" class="blurb" text-anchor="start">เพื่อปรับภาวะ สมรรถภาพ หรืออายุขัย</text><text x="484" y="206" class="blurb" text-anchor="start">ของตนเอง และตรวจสอบผล</text><rect x="484" y="240" width="210" height="34" rx="8" class="pill"/><text x="589" y="262" class="pill-t" text-anchor="middle">ขอบเขตที่วิกินี้ครอบคลุม</text><path d="M228 290 V328 H330" class="stroke-muted"/><path d="M664 290 V328 H562" class="stroke-muted"/><rect x="330" y="304" width="232" height="52" rx="12" class="card"/><text x="446" y="324" class="idx" text-anchor="middle">จุดที่คาบกัน</text><text x="446" y="342" class="title-sm" text-anchor="middle">การทดลองยีนกับตนเอง</text><text x="28" y="382" class="h3" text-anchor="start">คำนี้ถูกบรรยายอย่างไร · แหล่งที่ตรวจสอบแล้ว</text><line x1="44" y1="490" x2="848" y2="490" class="stroke-muted"/><circle cx="84" cy="490" r="6" class="accent"/><text x="84.0" y="476" class="idx" text-anchor="middle">1992</text><text x="84.0" y="516" class="title-xs" text-anchor="middle">Merriam-Webster</text><text x="84.0" y="530" class="blurb" text-anchor="middle">การใช้ที่พบ</text><text x="84.0" y="544" class="blurb" text-anchor="middle">บัญชีแรก</text><circle cx="205" cy="490" r="6" class="accent"/><text x="204.66666666666669" y="512" class="idx" text-anchor="middle">2010</text><text x="204.66666666666669" y="426" class="title-xs" text-anchor="middle">Nature</text><text x="204.66666666666669" y="440" class="blurb" text-anchor="middle">แล็บชีววิทยา</text><text x="204.66666666666669" y="454" class="blurb" text-anchor="middle">ในโรงรถ</text><circle cx="325" cy="490" r="6" class="accent"/><text x="325.33333333333337" y="476" class="idx" text-anchor="middle">2013</text><text x="325.33333333333337" y="516" class="title-xs" text-anchor="middle">Delfanti</text><text x="325.33333333333337" y="530" class="blurb" text-anchor="middle">วิทยาศาสตร์เปิด</text><text x="325.33333333333337" y="544" class="blurb" text-anchor="middle">และ DIYbio</text><circle cx="446" cy="490" r="6" class="accent"/><text x="446.0" y="512" class="idx" text-anchor="middle">2017</text><text x="446.0" y="426" class="title-xs" text-anchor="middle">Wexler · Coenen</text><text x="446.0" y="440" class="blurb" text-anchor="middle">สองความหมาย</text><text x="446.0" y="454" class="blurb" text-anchor="middle">คำคลุมเครือ</text><circle cx="567" cy="490" r="6" class="accent"/><text x="566.6666666666667" y="476" class="idx" text-anchor="middle">2018</text><text x="566.6666666666667" y="516" class="title-xs" text-anchor="middle">Yetisen</text><text x="566.6666666666667" y="530" class="blurb" text-anchor="middle">วิทยาศาสตร์พลเมือง</text><text x="566.6666666666667" y="544" class="blurb" text-anchor="middle">กับดัดแปลงกาย</text><circle cx="687" cy="490" r="6" class="accent"/><text x="687.3333333333334" y="512" class="idx" text-anchor="middle">2019</text><text x="687.3333333333334" y="426" class="title-xs" text-anchor="middle">Science</text><text x="687.3333333333334" y="440" class="blurb" text-anchor="middle">กำกับเรื่อง</text><text x="687.3333333333334" y="454" class="blurb" text-anchor="middle">พันธุกรรม</text><circle cx="808" cy="490" r="6" class="accent"/><text x="808.0" y="476" class="idx" text-anchor="middle">2025</text><text x="808.0" y="516" class="title-xs" text-anchor="middle">Lorrimar</text><text x="808.0" y="530" class="blurb" text-anchor="middle">นิยามหลากหลาย</text><text x="808.0" y="544" class="blurb" text-anchor="middle">สี่สาย</text><text x="28" y="616" class="note" text-anchor="start">ไม่มีนิยามทางวิชาการที่เป็นทางการอันเดียว จุดร่วมคือการแทรกแซงอย่างตั้งใจ</text><text x="28" y="632" class="note" text-anchor="start">ความต้องการที่จะดีขึ้น และความเป็นทดลอง</text></svg>