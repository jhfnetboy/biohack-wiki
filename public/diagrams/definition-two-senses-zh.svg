</style><defs><marker id="definition-two-senses-zh-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker></defs><rect x="0" y="0" width="892" height="640" rx="16" class="bg"/><text x="28" y="36" class="kicker" text-anchor="start">词义从哪来</text><text x="28" y="64" class="headline" text-anchor="start">一个词，两种用法：本维基收录哪一种</text><rect x="28" y="92" width="400" height="198" rx="16" class="card"/><text x="48" y="122" class="title" text-anchor="start">用法一 · DIY 生物学</text><text x="48" y="142" class="idx" text-anchor="start">剑桥中译：生物发烧友实验</text><text x="48" y="170" class="blurb" text-anchor="start">不在正规科研机构的人自己做生物实验，</text><text x="48" y="188" class="blurb" text-anchor="start">对象多是细菌、酵母、植物和基因，</text><text x="48" y="206" class="blurb" text-anchor="start">常在家里或社区实验室。</text><rect x="48" y="240" width="200" height="34" rx="8" class="card"/><text x="148" y="262" class="title-sm" text-anchor="middle">本维基：只作背景</text><rect x="464" y="92" width="400" height="198" rx="16" class="card-hi"/><text x="484" y="122" class="title" text-anchor="start">用法二 · 改造自己的身心</text><text x="484" y="142" class="idx" text-anchor="start">剑桥中译：生物黑客行为</text><text x="484" y="170" class="blurb" text-anchor="start">用技术、药物、饮食、激素等手段，</text><text x="484" y="188" class="blurb" text-anchor="start">改善自己身心的状态、表现或寿命，</text><text x="484" y="206" class="blurb" text-anchor="start">并查看结果。</text><rect x="484" y="240" width="210" height="34" rx="8" class="pill"/><text x="589" y="262" class="pill-t" text-anchor="middle">本维基收录范围</text><path d="M228 290 V328 H330" class="stroke-muted"/><path d="M664 290 V328 H562" class="stroke-muted"/><rect x="330" y="304" width="232" height="52" rx="12" class="card"/><text x="446" y="324" class="idx" text-anchor="middle">两者交叉</text><text x="446" y="342" class="title-sm" text-anchor="middle">在自己身上做基因实验</text><text x="28" y="382" class="h3" text-anchor="start">这个词怎么被描述 · 已核实来源</text><line x1="44" 