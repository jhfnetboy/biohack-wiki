<svg xmlns="http://www.w3.org/2000/svg" class="bh-fig" viewBox="0 0 892 640" width="892" height="640" role="img" aria-labelledby="definition-two-senses-zh-t definition-two-senses-zh-d"><title id="definition-two-senses-zh-t">“生物黑客”的两种用法与定义时间线</title><desc id="definition-two-senses-zh-d">词典把生物黑客分成两种用法：DIY 生物学，与改造自己的身心。本维基收录后者。下方时间线列出本页引用的已核实来源。本维基原创示意图。</desc><style>
