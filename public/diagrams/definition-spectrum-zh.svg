<svg xmlns="http://www.w3.org/2000/svg" class="bh-fig" viewBox="0 0 892 420" width="892" height="420" role="img" aria-labelledby="definition-spectrum-zh-t definition-spectrum-zh-d"><title id="definition-spectrum-zh-t">从日常到前沿的生物黑客光谱</title><desc id="definition-spectrum-zh-d">从日常可测量的调整，到消费级工具与补充剂、诊所级手段，再到试验中或机构外的改造。光谱位置不代表风险高低或证据强弱。本维基原创示意图。</desc><style>
.bh-fig{--ink:#12352c;--card:#ffffff;--line:#d5e4dc;--teal:#1f7a5c;--soft:#e7f6f0;--bg:#f3f6f4;--muted:#3d5a50;--warn:#8a5a12;--warn-bg:#fff4e0;}
@media (prefers-color-scheme: dark){.bh-fig{--ink:#e7f6f0;--card:#13241f;--line:#2c4a40;--teal:#8ee0c2;--soft:#1c3d32;--bg:#121c19;--muted:#b7d4c8;--warn:#f0c27a;--warn-bg:#3a2c14;}}
.bh-fig.force-dark{--ink:#e7f6f0;--card:#13241f;--line:#2c4a40;--teal:#8ee0c2;--soft:#1c3d32;--bg:#121c19;--muted:#b7d4c8;--warn:#f0c27a;--warn-bg:#3a2c14;}
.bh-fig.force-light{--ink:#12352c;--card:#ffffff;--line:#d5e4dc;--teal:#1f7a5c;--soft:#e7f6f0;--bg:#f3f6f4;--muted:#3d5a50;--warn:#8a5a12;--warn-bg:#fff4e0;}
.bh-fig text{font-family:var(--sl-font-system, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Sarabun", "Noto Sans Thai", "Noto Sans CJK SC", "PingFang SC", sans-serif);}
.bh-fig .bg{fill:var(--bg);}
.bh-fig .kicker{font-size:10px;font-weight:700;letter-spacing:.08em;fill:var(--teal);}
.bh-fig .headline{font-size:22px;font-weight:700;letter-spacing:-.03em;fill:var(--ink);}
.bh-fig .h3{font-size:13px;font-weight:700;fill:var(--teal);letter-spacing:.02em;}
.bh-fig .card{fill:var(--card);stroke:var(--line);stroke-width:1;}
.bh-fig .card-hi{fill:var(--soft);stroke:var(--teal);stroke-width:1.5;}
.bh-fig .title{font-size:15px;font-weight:650;fill:var(--ink);}
.bh-fig .title-sm{font-size:13px;font-weight:600;fill:var(--ink);}
.bh-fig .title-xs{font-size:11px;font-weight:600;fill:var(--ink);}
.bh-fig .blurb{font-size:12px;fill:var(--muted);}
.bh-fig .note{font-size:12px;fill:var(--muted);}
.bh-fig .idx{font-size:11px;font-weight:700;fill:var(--teal);letter-spacing:.06em;}
.bh-fig .accent{fill:var(--teal);}
.bh-fig .stroke{stroke:var(--teal);fill:none;stroke-width:1.6;}
.bh-fig .stroke-muted{stroke:var(--line);fill:none;stroke-width:1.4;}
.bh-fig .warn{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1;}
.bh-fig .warn-t{font-size:12px;fill:var(--warn);font-weight:600;}
.bh-fig .pill{fill:var(--teal);}
.bh-fig .pill-t{font-size:11px;font-weight:700;fill:var(--card);}
.bh-fig .grad-a{stop-color:var(--soft);} .bh-fig .grad-b{stop-color:var(--teal);}
</style><defs><marker id="definition-spectrum-zh-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker></defs><rect x="0" y="0" width="892" height="420" rx="16" class="bg"/><text x="28" y="36" class="kicker" text-anchor="start">从日常到前沿</text><text x="28" y="64" class="headline" text-anchor="start">生物黑客是一条光谱，不是只有地下实验</text><defs><linearGradient id="definition-spectrum-zh-g2" x1="0" x2="1"><stop offset="0" class="grad-a"/><stop offset="1" class="grad-b"/></linearGradient></defs><rect x="28" y="96" width="836" height="14" rx="7" fill="url(#definition-spectrum-zh-g2)"/><text x="28" y="130" class="title-sm" text-anchor="start">日常</text><text x="864" y="130" class="title-sm" text-anchor="end">前沿</text><circle cx="128.0" cy="103" r="7" class="accent"/><rect x="28" y="146" width="200" height="164" rx="12" class="card"/><text x="44" y="168" class="title-sm" text-anchor="start">日常可测量的调整</text><circle cx="48" cy="192" r="2.5" class="accent"/><text x="58" y="196" class="blurb" text-anchor="start">记录睡眠和心率</text><circle cx="48" cy="214" r="2.5" class="accent"/><text x="58" y="218" class="blurb" text-anchor="start">有计划的晨光、冷暴露</text><circle cx="48" cy="236" r="2.5" class="accent"/><text x="58" y="240" class="blurb" text-anchor="start">定时进食</text><line x1="44" y1="274" x2="212" y2="274" class="stroke-muted"/><text x="44" y="292" class="idx" text-anchor="start">环境信号 · 量化自我</text><circle cx="340.0" cy="103" r="7" class="accent"/><rect x="240" y="146" width="200" height="164" rx="12" class="card"/><text x="256" y="168" class="title-sm" text-anchor="start">消费级工具与补充剂</text><circle cx="260" cy="192" r="2.5" class="accent"/><text x="270" y="196" class="blurb" text-anchor="start">可穿戴设备</text><circle cx="260" cy="214" r="2.5" class="accent"/><text x="270" y="218" class="blurb" text-anchor="start">连续血糖监测</text><circle cx="260" cy="236" r="2.5" class="accent"/><text x="270" y="240" class="blurb" text-anchor="start">营养补充剂</text><line x1="256" y1="274" x2="424" y2="274" class="stroke-muted"/><text x="256" y="292" class="idx" text-anchor="start">量化自我 · 生化小分子</text><circle cx="552.0" cy="103" r="7" class="accent"/><rect x="452" y="146" width="200" height="164" rx="12" class="card"/><text x="468" y="168" class="title-sm" text-anchor="start">诊所级</text><circle cx="472" cy="192" r="2.5" class="accent"/><text x="482" y="196" class="blurb" text-anchor="start">已批准的药物和肽</text><circle cx="472" cy="214" r="2.5" class="accent"/><text x="482" y="218" class="blurb" text-anchor="start">假肢</text><circle cx="472" cy="236" r="2.5" class="accent"/><text x="482" y="240" class="blurb" text-anchor="start">已批准的神经调控</text><line x1="468" y1="274" x2="636" y2="274" class="stroke-muted"/><text x="468" y="292" class="idx" text-anchor="start">肽 · 仿生 · 神经科技</text><circle cx="764.0" cy="103" r="7" class="accent"/><rect x="664" y="146" width="200" height="164" rx="12" class="card"/><text x="680" y="168" class="title-sm" text-anchor="start">试验中或机构外</text><circle cx="684" cy="192" r="2.5" class="accent"/><text x="694" y="196" class="blurb" text-anchor="start">基因疗法与编辑</text><circle cx="684" cy="214" r="2.5" class="accent"/><text x="694" y="218" class="blurb" text-anchor="start">脑机接口</text><circle cx="684" cy="236" r="2.5" class="accent"/><text x="694" y="240" class="blurb" text-anchor="start">自行植入芯片、磁体</text><line x1="680" y1="274" x2="848" y2="274" class="stroke-muted"/><text x="680" y="292" class="idx" text-anchor="start">基因 · 神经科技 · 植入</text><rect x="28" y="330" width="410" height="62" rx="10" class="warn"/><text x="44" y="352" class="warn-t" text-anchor="start">越靠近日常，不一定风险越低；</text><text x="44" y="370" class="warn-t" text-anchor="start">越靠近前沿，也不等于证据越充分。</text><rect x="454" y="330" width="410" height="62" rx="10" class="card"/><text x="470" y="352" class="note" text-anchor="start">合法与否因地区、产品批文和具体用法而不同，</text><text x="470" y="370" class="note" text-anchor="start">需要逐条核对。例子只作说明，不是推荐。</text></svg>