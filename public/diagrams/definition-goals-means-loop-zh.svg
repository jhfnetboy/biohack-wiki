.bh-fig .warn{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1;}
.bh-fig .warn-t{font-size:12px;fill:var(--warn);font-weight:600;}
.bh-fig .pill{fill:var(--teal);}
.bh-fig .pill-t{font-size:11px;font-weight:700;fill:var(--card);}
.bh-fig .grad-a{stop-color:var(--soft);} .bh-fig .grad-b{stop-color:var(--teal);}
</style><defs><marker id="definition-goals-means-loop-zh-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker></defs><rect x="0" y="0" width="892" height="560" rx="16" class="bg"/><text x="28" y="36" class="kicker" text-anchor="start">本维基的定义</text><text x="28" y="64" class="headline" text-anchor="start">生物黑客 = 目的 × 手段 × 反馈</text><text x="28" y="88" class="note" text-anchor="start">为了修复、增强或延寿，自己做主、有意识地干预自己的身心，并查看结果。</text><text x="28" y="128" class="h3" text-anchor="start">为什么做 · 三个目的</text><rect x="28" y="142" width="220" height="98" rx="12" class="card"/><rect x="28" y="142" width="5" height="98" rx="2" class="accent"/><text x="48" y="172" class="title" text-anchor="start">修复</text><text x="48" y="198" class="blurb" text-anchor="start">把受损或失去的功能</text><text x="48" y="214" class="blurb" text-anchor="start">尽量拉回通常水平</text><rect x="28" y="254" width="220" height="98" rx="12" class="card"/><rect x="28" y="254" width="5" height="98" rx="2" class="accent"/><text x="48" y="284" class="title" text-anchor="start">增强</text><text x="48" y="310" class="blurb" text-anchor="start">没有缺损时，把能力做得</text><text x="48" y="326" class="blurb" text-anchor="start">更强，或加上新能力</text><rect x="28" y="366" width="220" height="98" rx="12" class="card"/><rect x="28" y="366" width="5" height="98" rx="2" class="accent"/><text x="48" y="396" class="title" text-anchor="start">延寿</text><text x="48" y="422" class="blurb" text-anchor="start">推迟随年龄而来的衰退，</text><text x="48" y="438" class="blurb" text-anchor="start">延长健康活着的年数</text><text x="280" y="128" class="h3" text-anchor="start">用什么 · 十个领域</text><rect x="280" y="142" width="124" height="52" rx="10" class="card"/><text x="294" y="158" class="idx" text-anchor="start">01</text><text x="294" y="180" class="title-sm" text-anchor="start">量化自我</text><rect x="412" y="142" width="124" height="52" rx="10" class="card"/><text x="426" y="158" class="idx" text-anchor="start">02</text><text x="426" y="180" class="title-sm" text-anchor="start">环境信号</text><rect x="280" y="206" width="124" height="52" rx="10" class="card"/><text x="294" y="222" class="idx" text-anchor="start">03</text><text x="294" y="244" class="title-sm" text-anchor="start">生化小分子</text><rect x="412" y="206" width="124" height="52" rx="10" class="card"/><text x="426" y="222" class="idx" text-anchor="start">04</text><text x="426" y="244" class="title-sm" text-anchor="start">肽</text><rect x="280" y="270" width="124" height="52" rx="10" class="card"/><text x="294" y="286" class="idx" text-anchor="start">05</text><text x="294" y="308" class="title-sm" text-anchor="start">基因</text><rect x="412" y="270" width="124" height="52" rx="10" class="card"/><text x="426" y="286" class="idx" text-anchor="start">06</text><text x="426" y="308" class="title-sm" text-anchor="start">细胞与再生</text><rect x="280" y="334" width="124" height="52" rx="10" class="card"/><text x="294" y="350" class="idx" text-anchor="start">07</text><text x="294" y="372" class="title-sm" text-anchor="start">微生物组</text><rect x="412" y="334" width="124" height="52" rx="10" class="card"/><text x="426" y="350" class="idx" text-anchor="start">08</text><text x="426" y="372" class="title-sm" text-anchor="start">神经科技</text><rect x="280" y="398" width="124" height="52" rx="10" class="card"/><text x="294" y="414" class="idx" text-anchor="start">09</text><text x="294" y="436" class="title-sm" text-anchor="start">植入与赛博格</text><rect x="412" y="398" width="124" height="52" rx="10" class="card"/><text x="426" y="414" class="idx" text-anchor="start">10</text><text x="426" y="436" class="title-sm" text-anchor="start">仿生</text><path d="M252 310 H272" class="stroke" marker-end="url(#definition-goals-means-loop-zh-arr)"/><path d="M542 310 H566" class="stroke" marker-end="url(#definition-goals-means-loop-zh-arr)"/><text x="580" y="128" class="h3" text-anchor="start">怎么做 · 反馈循环</text><circle cx="728" cy="310" r="96" class="stroke-muted"/><path d="M754.5 217.7 A96 96 0 0 1 820.3 283.5" class="stroke" marker-end="url(#definition-goals-means-loop-zh-arr)"/><path d="M820.3 336.5 A96 96 0 0 1 754.5 402.3" class="stroke" marker-end="url(#definition-goals-means-loop-zh-arr)"/><path d="M701.5 402.3 A96 96 0 0 1 635.7 336.5" class="stroke" marker-end="url(#definition-goals-means-loop-zh-arr)"/><path d="M635.7 283.5 A96 96 0 0 1 701.5 217.7" class="stroke" marker-end="url(#definition-goals-means-loop-zh-arr)"/><rect x="652.0" y="188" width="152" height="52" rx="10" class="card"/><text x="728" y="210" class="title-xs" text-anchor="middle">① 先测量</text><text x="728" y="228" class="blurb" text-anchor="middle">看清现在在哪</text><rect x="748.0" y="284" width="152" height="52" rx="10" class="card"/><text x="824" y="306" class="title-xs" text-anchor="middle">② 有意识地干预</text><text x="824" y="324" class="blurb" text-anchor="middle">按目的选手段</text><rect x="652.0" y="380" width="152" height="52" rx="10" class="card"/><text x="728" y="402" class="title-xs" text-anchor="middle">③ 查看结果</text><text x="728" y="420" class="blurb" text-anchor="middle">数据或可感知的变化</text><rect x="556.0" y="284" width="152" height="52" rx="10" class="card"/><text x="632" y="306" class="title-xs" text-anchor="middle">④ 调整或停止</text><text x="632" y="324" class="blurb" text-anchor="middle">依据结果决定</text><rect x="28" y="508" width="836" height="38" rx="10" class="warn"/><text x="46" y="532" class="warn-t" text-anchor="start">同一种手段可以服务多个目的。出现在这张图里，不等于已经证明有效、安全或合法。</text></svg>