<svg xmlns="http://www.w3.org/2000/svg" class="bh-fig" viewBox="0 0 892 560" width="892" height="560" role="img" aria-labelledby="definition-goals-means-loop-th-t definition-goals-means-loop-th-d"><title id="definition-goals-means-loop-th-t">ไบโอแฮกกิง: เป้าหมาย วิธี และผลตอบกลับ</title><desc id="definition-goals-means-loop-th-d">สามเป้าหมาย (ฟื้นฟู เสริมศักยภาพ ยืดสุขภาพ) บอกว่าทำไปเพื่ออะไร สิบโดเมนบอกว่าใช้อะไร การวัด การแทรกแซง การดูผล และการปรับ เป็นวงจรผลตอบกลับ ภาพประกอบต้นฉบับของวิกินี้</desc><style>
.bh-fig{--ink:#12352c;--card:#ffffff;--line:#d5e4dc;--teal:#1f7a5c;--soft:#e7f6f0;--bg:#f3f6f4;--muted:#3d5a50;--warn:#8a5a12;--warn-bg:#fff4e0;}
@media (prefers-color-scheme: dark){.bh-fig{--ink:#e7f6f0;--card:#13241f;--line:#2c4a40;--teal:#8ee0c2;--soft:#1c3d32;--bg:#121c19;--muted:#b7d4c8;--warn:#f0c27a;--warn-bg:#3a2c14;}}
.bh-fig.force-dark{--ink:#e7f6f0;--card:#13241f;--line:#2c4a40;--teal:#8ee0c2;--soft:#1c3d32;--bg:#121c19;--muted:#b7d4c8;--warn:#f0c27a;--warn-bg:#3a2c14;}
.bh-fig.force-light{--ink:#12352c;--card:#ffffff;--line:#d5e4dc;--teal:#1f7a5c;--soft:#e7f6f0;--bg:#f3f6f4;--muted:#3d5a50;--warn:#8a5a12;--warn-bg:#fff4e0;}
.bh-fig text{font-family:var(--sl-font-system, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Sarabun", "Noto Sans Thai", "Noto Sans CJK SC", "PingFang SC", sans-serif);}
.bh-fig .bg{fill:var(--bg);}
.bh-fig .kicker{font-size:10px;font-weight:700;letter-spacing:.08em;fill:var(--teal);}
.bh-fig .headline{font-size:22px;font-weight:700;letter-spacing:-.03em;fill:var(--ink);}
.bh-fig .h3{font-size:13px;font-weight:700;fill:var(--teal);letter-spacing:.02em;}
.bh-fig .card{fill:var(--card);stroke:var(--line);stroke-width:1;}
.bh-fig .card-hi{fill:var(--soft);stroke:var(--teal);stroke-width:1.5;}
.bh-fig .title{font-size:15px;font-weight:650;fill:var(--ink);}
.bh-fig .title-sm{font-size:13px;font-weight:600;fill:var(--ink);}
.bh-fig .title-xs{font-size:11px;font-weight:600;fill:var(--ink);}
.bh-fig .blurb{font-size:12px;fill:var(--muted);}
.bh-fig .note{font-size:12px;fill:var(--muted);}
.bh-fig .idx{font-size:11px;font-weight:700;fill:var(--teal);letter-spacing:.06em;}
.bh-fig .accent{fill:var(--teal);}
.bh-fig .stroke{stroke:var(--teal);fill:none;stroke-width:1.6;}
.bh-fig .stroke-muted{stroke:var(--line);fill:none;stroke-width:1.4;}
.bh-fig .warn{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1;}
.bh-fig .warn-t{font-size:12px;fill:var(--warn);font-weight:600;}
.bh-fig .pill{fill:var(--teal);}
.bh-fig .pill-t{font-size:11px;font-weight:700;fill:var(--card);}
.bh-fig .grad-a{stop-color:var(--soft);} .bh-fig .grad-b{stop-color:var(--teal);}
</style><defs><marker id="definition-goals-means-loop-th-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker></defs><rect x="0" y="0" width="892" height="560" rx="16" class="bg"/><text x="28" y="36" class="kicker" text-anchor="start">นิยามของวิกินี้</text><text x="28" y="64" class="headline" text-anchor="start">ไบโอแฮกกิง = เป้าหมาย × วิธี × ผลตอบกลับ</text><text x="28" y="86" class="note" text-anchor="start">กำหนดแนวทางด้วยตนเอง แทรกแซงร่างกายและจิตใจของตนเองอย่างตั้งใจ</text><text x="28" y="102" class="note" text-anchor="start">เพื่อฟื้นฟู เสริมศักยภาพ หรือยืดสุขภาพ และตรวจสอบผล</text><text x="28" y="128" class="h3" text-anchor="start">ทำไปเพื่ออะไร · สามเป้าหมาย</text><rect x="28" y="142" width="220" height="98" rx="12" class="card"/><rect x="28" y="142" width="5" height="98" rx="2" class="accent"/><text x="48" y="172" class="title" text-anchor="start">ฟื้นฟู</text><text x="48" y="198" class="blurb" text-anchor="start">ดึงหน้าที่ที่เสียหรือสูญ</text><text x="48" y="214" class="blurb" text-anchor="start">ให้กลับเข้าใกล้ระดับปกติ</text><rect x="28" y="254" width="220" height="98" rx="12" class="card"/><rect x="28" y="254" width="5" height="98" rx="2" class="accent"/><text x="48" y="284" class="title" text-anchor="start">เสริมศักยภาพ</text><text x="48" y="310" class="blurb" text-anchor="start">เมื่อไม่มีภาวะบกพร่อง</text><text x="48" y="326" class="blurb" text-anchor="start">ยกระดับความสามารถหรือเพิ่มใหม่</text><rect x="28" y="366" width="220" height="98" rx="12" class="card"/><rect x="28" y="366" width="5" height="98" rx="2" class="accent"/><text x="48" y="396" class="title" text-anchor="start">ยืดสุขภาพ</text><text x="48" y="422" class="blurb" text-anchor="start">ชะลอความเสื่อมตามวัย</text><text x="48" y="438" class="blurb" text-anchor="start">ยืดปีที่มีสุขภาพดี</text><text x="280" y="128" class="h3" text-anchor="start">ใช้อะไร · สิบโดเมน</text><rect x="280" y="142" width="124" height="52" rx="10" class="card"/><text x="294" y="158" class="idx" text-anchor="start">01</text><text x="294" y="180" class="title-sm" text-anchor="start">การวัดตนเอง</text><rect x="412" y="142" width="124" height="52" rx="10" class="card"/><text x="426" y="158" class="idx" text-anchor="start">02</text><text x="426" y="174" class="title-xs" text-anchor="start">สัญญาณ</text><text x="426" y="188" class="title-xs" text-anchor="start">สิ่งแวดล้อม</text><rect x="280" y="206" width="124" height="52" rx="10" class="card"/><text x="294" y="222" class="idx" text-anchor="start">03</text><text x="294" y="238" class="title-xs" text-anchor="start">ชีวเคมี</text><text x="294" y="252" class="title-xs" text-anchor="start">โมเลกุลเล็ก</text><rect x="412" y="206" width="124" height="52" rx="10" class="card"/><text x="426" y="222" class="idx" text-anchor="start">04</text><text x="426" y="244" class="title-sm" text-anchor="start">เปปไทด์</text><rect x="280" y="270" width="124" height="52" rx="10" class="card"/><text x="294" y="286" class="idx" text-anchor="start">05</text><text x="294" y="308" class="title-sm" text-anchor="start">พันธุกรรม</text><rect x="412" y="270" width="124" height="52" rx="10" class="card"/><text x="426" y="286" class="idx" text-anchor="start">06</text><text x="426" y="302" class="title-xs" text-anchor="start">เซลล์และ</text><text x="426" y="316" class="title-xs" text-anchor="start">การฟื้นฟู</text><rect x="280" y="334" width="124" height="52" rx="10" class="card"/><text x="294" y="350" class="idx" text-anchor="start">07</text><text x="294" y="372" class="title-sm" text-anchor="start">จุลินทรีย์</text><rect x="412" y="334" width="124" height="52" rx="10" class="card"/><text x="426" y="350" class="idx" text-anchor="start">08</text><text x="426" y="366" class="title-xs" text-anchor="start">เทคโนโลยี</text><text x="426" y="380" class="title-xs" text-anchor="start">ประสาท</text><rect x="280" y="398" width="124" height="52" rx="10" class="card"/><text x="294" y="414" class="idx" text-anchor="start">09</text><text x="294" y="436" class="title-sm" text-anchor="start">ไซบอร์ก</text><rect x="412" y="398" width="124" height="52" rx="10" class="card"/><text x="426" y="414" class="idx" text-anchor="start">10</text><text x="426" y="436" class="title-sm" text-anchor="start">ไบโอนิก</text><path d="M252 310 H272" class="stroke" marker-end="url(#definition-goals-means-loop-th-arr)"/><path d="M542 310 H566" class="stroke" marker-end="url(#definition-goals-means-loop-th-arr)"/><text x="580" y="128" class="h3" text-anchor="start">ทำอย่างไร · วงจรผลตอบกลับ</text><circle cx="728" cy="310" r="96" class="stroke-muted"/><path d="M754.5 217.7 A96 96 0 0 1 820.3 283.5" class="stroke" marker-end="url(#definition-goals-means-loop-th-arr)"/><path d="M820.3 336.5 A96 96 0 0 1 754.5 402.3" class="stroke" marker-end="url(#definition-goals-means-loop-th-arr)"/><path d="M701.5 402.3 A96 96 0 0 1 635.7 336.5" class="stroke" marker-end="url(#definition-goals-means-loop-th-arr)"/><path d="M635.7 283.5 A96 96 0 0 1 701.5 217.7" class="stroke" marker-end="url(#definition-goals-means-loop-th-arr)"/><rect x="652.0" y="188" width="152" height="52" rx="10" class="card"/><text x="728" y="210" class="title-xs" text-anchor="middle">① วัดก่อน</text><text x="728" y="228" class="blurb" text-anchor="middle">ดูว่าตอนนี้อยู่ตรงไหน</text><rect x="748.0" y="284" width="152" height="52" rx="10" class="card"/><text x="824" y="306" class="title-xs" text-anchor="middle">② แทรกแซงอย่างตั้งใจ</text><text x="824" y="324" class="blurb" text-anchor="middle">เลือกวิธีตามเป้าหมาย</text><rect x="652.0" y="380" width="152" height="52" rx="10" class="card"/><text x="728" y="402" class="title-xs" text-anchor="middle">③ ดูผล</text><text x="728" y="420" class="blurb" text-anchor="middle">ข้อมูลหรือการเปลี่ยนแปลงที่รู้ได้</text><rect x="556.0" y="284" width="152" height="52" rx="10" class="card"/><text x="632" y="306" class="title-xs" text-anchor="middle">④ ปรับหรือหยุด</text><text x="632" y="324" class="blurb" text-anchor="middle">ตัดสินจากผลที่ได้</text><rect x="28" y="508" width="836" height="38" rx="10" class="warn"/><text x="46" y="522" class="warn-t" text-anchor="start">วิธีเดียวกันอาจรับใช้ได้มากกว่าหนึ่งเป้าหมาย</text><text x="46" y="538" class="warn-t" text-anchor="start">การอยู่ในภาพนี้ไม่ได้แปลว่าพิสูจน์แล้วว่าได้ผล ปลอดภัย หรือถูกกฎหมาย</text></svg>