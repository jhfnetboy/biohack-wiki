<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 210" role="img" aria-labelledby="title desc">
  <title id="title">แผนภาพห่วงโซ่สัญญาณสมองกับคอมพิวเตอร์</title>
  <desc id="desc">แผนภาพต้นฉบับ ไม่ใช่ภาพของอุปกรณ์ที่มีชื่อ และไม่ใช่ขั้นตอน</desc>
  <rect width="980" height="210" fill="#f4f7fb"/>
  <text x="24" y="34" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#12352c">ห่วงโซ่สัญญาณ (แผนภาพเท่านั้น)</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#12352c">
    <rect x="24" y="58" width="160" height="78" rx="8" fill="#d7e8f5"/>
    <text x="40" y="104">สัญญาณประสาท</text>
    <rect x="214" y="58" width="170" height="78" rx="8" fill="#d7f5ea"/>
    <text x="228" y="96">เซนเซอร์หรือ</text>
    <text x="228" y="116">อิเล็กโทรด</text>
    <rect x="414" y="58" width="160" height="78" rx="8" fill="#fff4cc"/>
    <text x="430" y="104">ถอดรหัสเจตนา</text>
    <rect x="604" y="58" width="180" height="78" rx="8" fill="#e7e4f7"/>
    <text x="618" y="96">คอมพิวเตอร์หรือ</text>
    <text x="618" y="116">อุปกรณ์ช่วย</text>
    <rect x="814" y="58" width="142" height="78" rx="8" fill="#f7e7d8"/>
    <text x="828" y="104">ข้อมูลย้อนกลับ</text>
  </g>
  <g stroke="#12352c" stroke-width="1.5" fill="none">
    <path d="M184 97 H214"/>
    <path d="M384 97 H414"/>
    <path d="M574 97 H604"/>
    <path d="M784 97 H814"/>
  </g>
  <text x="24" y="178" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#333">ภาพร่างสำหรับจัดเก็บ ไม่ใช่หลักฐานว่าระบบที่มีชื่อนั้นใช้ได้ และไม่ใช่คู่มือประกอบ</text>
</svg>
