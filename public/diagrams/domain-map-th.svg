<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
  <title id="title">สิบโดเมน (แผนที่บรรณาธิการ)</title>
  <desc id="desc">แผนภาพต้นฉบับของสิบโดเมนในวิกินี้ ไม่ได้คัดลอกจากบุคคลที่สาม แต่ละกล่องลิงก์ไปยังหน้าโดเมนนั้น</desc>
  <rect width="920" height="620" fill="#f4f7f5"/>
  <text x="32" y="42" font-family="Georgia, serif" font-size="22" fill="#12352c">สิบโดเมน (แผนที่บรรณาธิการ)</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#12352c">
    <a href="/th/quantified-self/">
      <g>
        <rect x="32" y="78" width="270" height="64" rx="8" fill="#fff4cc"/>
        <text x="48" y="104">1 การวัดตนเอง</text>
        <text x="48" y="124" font-size="12" fill="#245">อุปกรณ์สวมใส่, CGM, HRV</text>
      </g>
    </a>
    <a href="/th/lifestyle/">
      <g>
        <rect x="322" y="78" width="270" height="64" rx="8" fill="#efe7ff"/>
        <text x="338" y="104">2 สัญญาณสิ่งแวดล้อม</text>
        <text x="338" y="124" font-size="12" fill="#245">แสง, ร้อนเย็น, เวลา</text>
      </g>
    </a>
    <a href="/th/biochemical/">
      <g>
        <rect x="32" y="168" width="270" height="64" rx="8" fill="#d7f5ea"/>
        <text x="48" y="194">3 ชีวเคมีโมเลกุลเล็ก</text>
        <text x="48" y="214" font-size="12" fill="#245">โมเลกุลเล็ก, ฮอร์โมน, สารเสริมการรู้คิด</text>
      </g>
    </a>
    <a href="/th/peptides/">
      <g>
        <rect x="322" y="168" width="270" height="64" rx="8" fill="#c5ebd8"/>
        <text x="338" y="194">4 เปปไทด์</text>
        <text x="338" y="214" font-size="12" fill="#245">สัญญาณกรดอะมิโน, ความบริสุทธิ์</text>
      </g>
    </a>
    <a href="/th/genetic/">
      <g>
        <rect x="32" y="258" width="270" height="64" rx="8" fill="#f7dce3"/>
        <text x="48" y="284">5 พันธุกรรม</text>
        <text x="48" y="304" font-size="12" fill="#245">ยีน, RNA, ชีววิทยาสังเคราะห์</text>
      </g>
    </a>
    <a href="/th/cellular/">
      <g>
        <rect x="322" y="258" width="270" height="64" rx="8" fill="#f3d4e8"/>
        <text x="338" y="284">6 เซลล์และการฟื้นฟู</text>
        <text x="338" y="304" font-size="12" fill="#245">เซลล์ต้นกำเนิด, เนื้อเยื่อ, การรีโปรแกรม</text>
      </g>
    </a>
    <a href="/th/microbiome/">
      <g>
        <rect x="612" y="258" width="270" height="64" rx="8" fill="#e3f6f2"/>
        <text x="628" y="284">7 จุลินทรีย์</text>
        <text x="628" y="304" font-size="12" fill="#245">ลำไส้, อาหาร, จุลินทรีย์</text>
      </g>
    </a>
    <a href="/th/neurohacking/">
      <g>
        <rect x="32" y="348" width="270" height="64" rx="8" fill="#d7e8f5"/>
        <text x="48" y="374">8 เทคโนโลยีประสาท</text>
        <text x="48" y="394" font-size="12" fill="#245">การบันทึก, การกระตุ้น, BCI</text>
      </g>
    </a>
    <a href="/th/cyborg/">
      <g>
        <rect x="322" y="348" width="270" height="64" rx="8" fill="#f7e7d8"/>
        <text x="338" y="374">9 ไซบอร์ก</text>
        <text x="338" y="394" font-size="12" fill="#245">อุปกรณ์ฝัง, แม่เหล็ก, เซ็นเซอร์</text>
      </g>
    </a>
    <a href="/th/bionic/">
      <g>
        <rect x="612" y="348" width="270" height="64" rx="8" fill="#e7e4f7"/>
        <text x="628" y="374">10 ไบโอนิก</text>
        <text x="628" y="394" font-size="12" fill="#245">อวัยวะเทียม, โครงกระดูกกล</text>
      </g>
    </a>
  </g>
  <text x="32" y="478" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#333">กล่องทับกันโดยตั้งใจ โครงการเดียวอยู่ได้มากกว่าหนึ่งโดเมน</text>
  <text x="32" y="506" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#333">ตัวอย่างที่จัดใน 8 และ 10: สัญญาณจากระบบประสาทใช้ขับอุปกรณ์ช่วย</text>
  <path d="M302 380 H310 V422 H612 V380" stroke="#12352c" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#12352c"/>
    </marker>
  </defs>
</svg>
