<svg xmlns="http://www.w3.org/2000/svg" class="bh-domain-map" width="100%" role="group" aria-labelledby="bh-domain-map-title bh-domain-map-desc">
  <title id="bh-domain-map-title">สิบโดเมน</title>
  <desc id="bh-domain-map-desc">แผนภาพสิบโดเมนของวิกินี้ ไม่ได้คัดลอกจากบุคคลที่สาม แต่ละการ์ดลิงก์ไปยังหน้าโดเมนนั้น</desc>
  <style>
    .bh-domain-map {
      --dm-ink: #12352c;
      --dm-card: #ffffff;
      --dm-line: #d5e4dc;
      --dm-teal: #1f7a5c;
      --dm-banner: #f3f6f4;
      --dm-muted: #3d5a50;
      background: transparent;
    }
    @media (prefers-color-scheme: dark) {
      .bh-domain-map {
        --dm-ink: #e7f6f0;
        --dm-card: #13241f;
        --dm-line: #2c4a40;
        --dm-teal: #8ee0c2;
        --dm-banner: #121c19;
        --dm-muted: #b7d4c8;
      }
    }
    .bh-domain-map .bg { fill: var(--dm-banner); }
    .bh-domain-map .headline {
      font-family: var(--sl-font-system, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      fill: var(--dm-ink);
    }
    .bh-domain-map .kicker {
      font-family: var(--sl-font-system, ui-sans-serif, system-ui, sans-serif);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      fill: var(--dm-teal);
    }
    .bh-domain-map .note {
      font-family: var(--sl-font-system, ui-sans-serif, system-ui, sans-serif);
      font-size: 13px;
      fill: var(--dm-muted);
    }
    .bh-domain-map .card {
      fill: var(--dm-card);
      stroke: var(--dm-line);
      stroke-width: 1;
    }
    .bh-domain-map .accent { fill: var(--dm-teal); }
    .bh-domain-map .idx {
      font-family: var(--sl-font-system, ui-sans-serif, system-ui, sans-serif);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      fill: var(--dm-teal);
    }
    .bh-domain-map .title {
      font-family: var(--sl-font-system, ui-sans-serif, system-ui, sans-serif);
      font-size: 14px;
      font-weight: 650;
      fill: var(--dm-ink);
    }
    .bh-domain-map .blurb {
      font-family: var(--sl-font-system, ui-sans-serif, system-ui, sans-serif);
      font-size: 12px;
      fill: var(--dm-muted);
    }
    .bh-domain-map .dm-mobile .headline { font-size: 24px; }
    .bh-domain-map .dm-mobile .title { font-size: 16px; }
    .bh-domain-map .dm-mobile .blurb { font-size: 13px; }
    .bh-domain-map .dm-mobile .idx { font-size: 12px; }
    .bh-domain-map a.node { cursor: pointer; }
    .bh-domain-map a.node:hover .card,
    .bh-domain-map a.node:focus-visible .card { stroke: var(--dm-teal); }
    /* Aspect-ratio and show/hide apply only to the standalone wrapper
       (a root .bh-domain-map that is not itself a hoisted layout). */
    svg.bh-domain-map:not(.dm-desktop):not(.dm-mobile) {
      width: 100%;
      height: auto;
      display: block;
    }
    svg.bh-domain-map:not(.dm-desktop):not(.dm-mobile) .dm-desktop,
    svg.bh-domain-map:not(.dm-desktop):not(.dm-mobile) .dm-mobile {
      width: 100%;
      height: 100%;
    }
    @media (min-width: 641px) {
      svg.bh-domain-map:not(.dm-desktop):not(.dm-mobile) .dm-mobile { display: none; }
      svg.bh-domain-map:not(.dm-desktop):not(.dm-mobile) { aspect-ratio: 892 / 500; }
    }
    @media (max-width: 640px) {
      svg.bh-domain-map:not(.dm-desktop):not(.dm-mobile) .dm-desktop { display: none; }
      svg.bh-domain-map:not(.dm-desktop):not(.dm-mobile) { aspect-ratio: 400 / 1040; }
    }
  </style>
  <svg class="dm-desktop" viewBox="0 0 892 500" width="100%" height="100%" overflow="visible">
    <rect class="bg" width="892" height="500" rx="16"/>
    <text class="kicker" x="24" y="32">แผนที่บรรณาธิการ</text>
    <text class="headline" x="24" y="54">สิบโดเมน</text>
      <a class="node" href="/th/quantified-self/" aria-label="01 การวัดตนเอง">
        <g transform="translate(24 72)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">01</text>
          <text class="title" x="44" y="22">การวัดตนเอง</text>
          <text class="blurb" x="16" y="46">อุปกรณ์สวมใส่, CGM, HRV</text>
        </g>
      </a>
      <a class="node" href="/th/lifestyle/" aria-label="02 สัญญาณสิ่งแวดล้อม">
        <g transform="translate(312 72)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">02</text>
          <text class="title" x="44" y="22">สัญญาณสิ่งแวดล้อม</text>
          <text class="blurb" x="16" y="46">แสง, ร้อนเย็น, เวลา</text>
        </g>
      </a>
      <a class="node" href="/th/biochemical/" aria-label="03 ชีวเคมีโมเลกุลเล็ก">
        <g transform="translate(24 156)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">03</text>
          <text class="title" x="44" y="22">ชีวเคมีโมเลกุลเล็ก</text>
          <text class="blurb" x="16" y="46">โมเลกุลเล็ก, ฮอร์โมน, สารเสริมการรู้คิด</text>
        </g>
      </a>
      <a class="node" href="/th/peptides/" aria-label="04 เปปไทด์">
        <g transform="translate(312 156)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">04</text>
          <text class="title" x="44" y="22">เปปไทด์</text>
          <text class="blurb" x="16" y="46">สัญญาณกรดอะมิโน, ความบริสุทธิ์</text>
        </g>
      </a>
      <a class="node" href="/th/genetic/" aria-label="05 พันธุกรรม">
        <g transform="translate(24 240)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">05</text>
          <text class="title" x="44" y="22">พันธุกรรม</text>
          <text class="blurb" x="16" y="46">ยีน, RNA, ชีววิทยาสังเคราะห์</text>
        </g>
      </a>
      <a class="node" href="/th/cellular/" aria-label="06 เซลล์และการฟื้นฟู">
        <g transform="translate(312 240)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">06</text>
          <text class="title" x="44" y="22">เซลล์และการฟื้นฟู</text>
          <text class="blurb" x="16" y="46">เซลล์ต้นกำเนิด, เนื้อเยื่อ, การรีโปรแกรม</text>
        </g>
      </a>
      <a class="node" href="/th/microbiome/" aria-label="07 จุลินทรีย์">
        <g transform="translate(600 240)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">07</text>
          <text class="title" x="44" y="22">จุลินทรีย์</text>
          <text class="blurb" x="16" y="46">ลำไส้, อาหาร, จุลินทรีย์</text>
        </g>
      </a>
      <a class="node" href="/th/neurohacking/" aria-label="08 เทคโนโลยีประสาท">
        <g transform="translate(24 324)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">08</text>
          <text class="title" x="44" y="22">เทคโนโลยีประสาท</text>
          <text class="blurb" x="16" y="46">การบันทึก, การกระตุ้น, BCI</text>
        </g>
      </a>
      <a class="node" href="/th/cyborg/" aria-label="09 ไซบอร์ก">
        <g transform="translate(312 324)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">09</text>
          <text class="title" x="44" y="22">ไซบอร์ก</text>
          <text class="blurb" x="16" y="46">อุปกรณ์ฝัง, แม่เหล็ก, เซ็นเซอร์</text>
        </g>
      </a>
      <a class="node" href="/th/bionic/" aria-label="10 ไบโอนิก">
        <g transform="translate(600 324)">
          <rect class="card" width="268" height="68" rx="12"/>
          <rect class="accent" width="4" height="68" rx="2"/>
          <text class="idx" x="16" y="22">10</text>
          <text class="title" x="44" y="22">ไบโอนิก</text>
          <text class="blurb" x="16" y="46">อวัยวะเทียม, โครงกระดูกกล</text>
        </g>
      </a>
    <text class="note" x="24" y="430">การ์ดทับกันได้ โครงการเดียวอยู่ได้มากกว่าหนึ่งโดเมน</text>
    <text class="note" x="24" y="450">ตัวอย่างใน 08 และ 10: สัญญาณจากระบบประสาทใช้ขับอุปกรณ์ช่วย</text>
  </svg>
